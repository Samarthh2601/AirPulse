
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}EcoSwitch{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}">
</head>

<body>

    <!-- Navbar -->
     
    <nav class="navbar navbar-expand-lg 
    {% if request.url.path == '/current' %}
        navbar-dark bg-black
    {% else %}
        navbar-light bg-white
    {% endif %}">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                EcoSwitch
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">


                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="bi bi-grid-1x2-fill me-1"></i>
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/current">
                            <i class="bi bi-cloud-sun-fill me-1"></i>
                            Current
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/forecast">
                            <i class="bi bi-graph-up-arrow me-1"></i>
                            Forecast
                        </a>
                    </li>

                    <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle"
                    href="#"
                    id="moreDropdown"
                    role="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">

                        <i class="bi bi-grid me-1"></i>
                        More
                    </a>

                    <ul class="dropdown-menu" aria-labelledby="moreDropdown">

                        <li>
                            <a class="dropdown-item" href="/compare/forecast">
                                <i class="bi bi-arrow-left-right me-2"></i>
                                Compare
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="/action-centre">
                                <i class="bi bi-shield-check me-2"></i>
                                Action Centre
                            </a>
                        </li>

                </ul>
            </li>

                </ul>

            </div>
            <form action="/set-city" method="POST"
      class="d-flex align-items-center gap-2">

    <input type="hidden"
           name="next"
           value="{{ request.url.path }}">

    <select name="city" class="form-select"
            style="width: 160px;">

        {% for city in cities %}

        <option value="{{ city }}"
            {% if city == selected_city %}selected{% endif %}>
            {{ city }}
        </option>

        {% endfor %}

    </select>

    <button type="submit" class="btn btn-success">
        Apply
    </button>

</form>
        </div>
    </nav>

    

    <!-- Page Content -->
    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
