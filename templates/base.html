
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}EcoSwitch{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}">
</head>

<body>

    <!-- Navbar -->
     
    <nav class="navbar navbar-expand-lg 
    {% if request.url.path == '/current' %}
        navbar-dark bg-black
    {% else %}
        navbar-light bg-white
    {% endif %}">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                EcoSwitch
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/current">Current</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/forecast">Forecast</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/compare/forecast">Compare</a>
                    </li>

                </ul>

            </div>
            <form action="/set-city" method="POST"
      class="d-flex align-items-center gap-2">

    <input type="hidden"
           name="next"
           value="{{ request.url.path }}">

    <select name="city" class="form-select"
            style="width: 160px;">

        {% for city in cities %}

        <option value="{{ city }}"
            {% if city == selected_city %}selected{% endif %}>
            {{ city }}
        </option>

        {% endfor %}

    </select>

    <button type="submit" class="btn btn-success">
        Apply
    </button>

</form>
        </div>
    </nav>

    

    <!-- Page Content -->
    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
